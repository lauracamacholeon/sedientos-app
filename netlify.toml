# Configuración para Netlify: cómo compilar y qué carpeta publicar.
[build]
  command = "npm run build"
  publish = "dist/sedientos/browser"

[build.environment]
  NODE_VERSION = "22"

# Archivos con hash en el nombre: se pueden guardar en caché un año.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
